name: public source
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: public-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run the canonical source lane
        run: python3 terrier test source --report "${RUNNER_TEMP}/source-lane.json"
      - name: Summarize timings
        if: always()
        run: python3 scripts/test-timing-summary.py "${RUNNER_TEMP}/source-lane.json" >> "${GITHUB_STEP_SUMMARY}"
  core-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Restore public Rust build cache
        id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            target/debug/deps
            target/debug/build
            target/debug/.fingerprint
          key: core-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}
      - name: Install the repository-pinned toolchain
        run: env -u RUSTUP_TOOLCHAIN rustup toolchain install --no-self-update
      - name: Collect the complete changed-file list for this merge revision
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-changed-files.py --output "${RUNNER_TEMP}/changed-files.json"
      - name: Select canonical affected checks
        if: github.event_name == 'pull_request'
        id: affected
        run: |
          python3 terrier test affected --changed-files-json "${RUNNER_TEMP}/changed-files.json" --plan > "${RUNNER_TEMP}/affected-plan.json"
          jq -r '"browser=" + ([.affected.components[] | select(. == "ui" or . == "display")] | length > 0 | tostring), "plugins=" + ([.affected.components[] | select(. == "dsh" or . == "managed")] | length > 0 | tostring), "contracts=" + (.affected.components | index("contracts") != null | tostring), "provisioner=" + (.affected.components | index("provisioner") != null | tostring)' "${RUNNER_TEMP}/affected-plan.json" >> "${GITHUB_OUTPUT}"
      - name: Prepare Node for selected components
        if: steps.affected.outputs.browser == 'true' || steps.affected.outputs.plugins == 'true' || steps.affected.outputs.provisioner == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Prepare browser dependencies and shared client
        if: steps.affected.outputs.browser == 'true'
        env:
          WASM_PACK_RELEASE: wasm-pack-v0.15.0-x86_64-unknown-linux-musl
          WASM_PACK_SHA256: c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
        run: |
          npm ci --ignore-scripts
          curl --fail --location --proto '=https' --tlsv1.2 --output "${RUNNER_TEMP}/wasm-pack.tar.gz" "https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/${WASM_PACK_RELEASE}.tar.gz"
          echo "${WASM_PACK_SHA256}  ${RUNNER_TEMP}/wasm-pack.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/wasm-pack.tar.gz" --directory "${RUNNER_TEMP}" "${WASM_PACK_RELEASE}/wasm-pack"
          export PATH="${RUNNER_TEMP}/${WASM_PACK_RELEASE}:${PATH}"
          python3 scripts/build-browser-core.py
      - name: Prepare plugin dependencies
        if: steps.affected.outputs.plugins == 'true'
        run: npm ci --prefix packages --ignore-scripts
      - name: Prepare contract tooling
        if: steps.affected.outputs.contracts == 'true'
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf
        with:
          version: v1.7.0
          cache: false
      - name: Prepare provisioner component dependencies
        if: steps.affected.outputs.provisioner == 'true'
        run: npm ci --prefix provisioner-scripts --ignore-scripts
      - name: Run core and affected PR checks
        if: github.event_name == 'pull_request'
        run: python3 terrier test affected --changed-files-json "${RUNNER_TEMP}/changed-files.json" --online --report "${RUNNER_TEMP}/core-lane.json"
      - name: Run core security checks on main
        if: github.event_name == 'push'
        run: python3 terrier test core --online --report "${RUNNER_TEMP}/core-lane.json"
      - name: Summarize timings
        if: always()
        run: python3 scripts/test-timing-summary.py "${RUNNER_TEMP}/core-lane.json" >> "${GITHUB_STEP_SUMMARY}"
      - name: Retain the structured report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-security-timing
          path: ${{ runner.temp }}/core-lane.json
          if-no-files-found: error
          retention-days: 7
      - name: Save trusted public dependency cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            target/debug/deps
            target/debug/build
            target/debug/.fingerprint
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
