name: public source
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Run the canonical source lane
        run: python3 terrier test source --report "${RUNNER_TEMP}/source-lane.json"
      - name: Summarize timings
        if: always()
        run: python3 scripts/test-timing-summary.py "${RUNNER_TEMP}/source-lane.json" >> "${GITHUB_STEP_SUMMARY}"
