[package]
name = "agentkeys-memory-openviking"
version = "0.1.0"
edition = "2021"
description = "OpenViking engine adapter — the daemon's distribution mirror writes gate-authorized knowledge items as OpenViking resources (L0/L1 sidecars from the item's title/preview). A leaf crate: no broker/worker dependency, so it never pulls them into a rebuild."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
reqwest = { version = "0.12", features = ["json"] }
sha2 = "0.10"
tracing = "0.1" # non-fatal manifest I/O failures must be visible, never silent
tokio = { workspace = true } # the bounded wait for the engine's sidecar placeholders

[dev-dependencies]
axum = { version = "0.7", features = ["json"] }
tokio = { workspace = true }
tempfile = "3"
